appId: com.comfy-pilot.app
productName: ComfyPilot
copyright: Copyright © 2026 ComfyPilot Contributors
directories:
  buildResources: resources
  output: release
publish:
  provider: github
  owner: ThzxxArt
  repo: ComfyPilot
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!src/**'
  - '!tests/**'
  - '!docs/**'
  # 0.1.18 (WP0): typecheck artefacts must never ship — 620 KB of dev-only
  # absolute paths, and their presence made the asar look complete when it was not.
  - '!out/tsc-*/**'
  - '!**/*.tsbuildinfo'
asar: true
# Preload ships through extraResources (the runtime loader wants a real file
# path); unpacking the asar copy too produced a third identical file.
asarUnpack: []
extraResources:
  - from: out/preload
    to: preload
  - from: out/renderer
    to: renderer
  - from: resources
    to: resources
    filter:
      - '**/*.ico'
      - '**/*.icns'
      - '**/*.png'
win:
  # electron-builder 26 rejects `publisherName` here (it is sign-tool config,
  # not a win target field) — identity comes from appId + setAppUserModelId.
  target:
    - target: nsis
      arch: [x64]
  icon: resources/ComfyPilot.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ComfyPilot
  installerIcon: resources/ComfyPilot.ico
  uninstallerIcon: resources/ComfyPilot.ico
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/ComfyPilot.icns
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  darkModeSupport: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: resources/comfypilot-appstore-512.png
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
