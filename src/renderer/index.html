<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 0.2.0: no remote scripts, no inline scripts. Media is limited to the
         two app protocols; network is limited to the dev server and ComfyUI
         origins (http/https; the main process still validates every URL). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: comfy-pilot-media:; media-src 'self' blob: comfy-pilot-media:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:* http: https:; object-src 'none'; base-uri 'none'; frame-src http: https:;"
    />
    <title>ComfyPilot</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
