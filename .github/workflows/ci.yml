name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure the Electron binary is installed
        # npm's script-approval policy can block package postinstall scripts;
        # e2e/build need the real binary, so rebuild it explicitly.
        run: npm rebuild electron

      - name: Typecheck (node)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Typecheck (web)
        run: npx vue-tsc --noEmit -p tsconfig.web.json

      - name: Typecheck (tests)
        run: npx tsc --noEmit -p tsconfig.test.json

      - name: Version consistency
        run: node scripts/check-version.cjs

      - name: i18n key parity & dynamic domains
        run: node scripts/check-i18n.cjs

      - name: Hardcoded Chinese gate
        run: node scripts/check-hardcoded-zh.cjs

      - name: ESLint (no fix)
        run: npm run lint:check

      - name: Unit & integration tests
        run: npx vitest run --coverage

      - name: Test-behaviour ratio gate
        run: npm run test:behavior

      - name: Coverage ratchet
        run: node scripts/coverage-ratchet.cjs

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage
          if-no-files-found: ignore
          retention-days: 7

      - name: Build (includes postbuild bootstrap copy)
        run: npm run build

      - name: E2E smoke
        if: runner.os == 'Windows'
        run: npx vitest run --config vitest.e2e.config.ts

      - name: E2E smoke (Linux under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx vitest run --config vitest.e2e.config.ts
